---
substitutions:
  # pH circuit, who's address is 99
  addPH: "99"
  update_ph: "60s"

  sorting_group_ph: '30'

web_server:
  sorting_groups:
    - id: sorting_group_ph
      name: "pH - EZO"
      sorting_weight: ${sorting_group_ph}

globals:
  - id: ph_cal_mid_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ph_cal_low_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ph_cal_high_done
    type: bool
    restore_value: true
    initial_value: 'false'
  # 26.6.14 (MR 11.139 G): diagnostic mode. While set, the component's poller is
  # STOPPED (stop_poller) and the compensation interval sends nothing, so an
  # Export/Import sequence is never interrupted by a T/S/R (any intervening
  # command restarts an export from line 1 - MR 11.138.3) and no diagnostic
  # reply can enter the live series (MR 11.138.2). NOT restored across a reboot.
  - id: ph_diag_mode
    type: bool
    restore_value: false
    initial_value: 'false'
  # Minutes spent in diagnostic mode; the watchdog interval auto-exits at 15 so
  # a forgotten 'Diagnostic Mode OFF' cannot leave the channel dark for hours.
  - id: ph_diag_ticks
    type: int
    restore_value: false
    initial_value: '0'

api:
  actions:
    - action: ph_change_address
      variables:
        address: int
      then:
        - lambda: |-
            id(ph_ezo).send_custom("I2C,{{address}}");
    - action: ph_read_continuous
      then:
        - repeat:
            count: 60
            then:
              - button.press: read_ph
              - delay: 1s
    - action: ph_calibrate_mid_7
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_mid(7.00);
            id(ph_cal_mid_done) = true;
            id(ph_cal_low_done) = false;
            id(ph_cal_high_done) = false;
    - action: ph_calibrate_low_4
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_low(4.00);
            id(ph_cal_low_done) = true;
    - action: ph_calibrate_high_10
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_high(10.00);
            id(ph_cal_high_done) = true;
    - action: ph_calibrate_high_1001
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_high(10.01);
    - action: ph_calibrate_mid
      variables:
        value: float
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_mid(value);
    - action: ph_calibrate_low
      variables:
        value: float
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_low(value);
    - action: ph_calibrate_high
      variables:
        value: float
      then:
        - lambda: |-
            id(ph_ezo).set_calibration_point_high(value);
    - action: ph_custom_command
      variables:
        command: string
      then:
        - lambda: |-
            id(ph_ezo).send_custom(command.c_str());

esphome:
  on_boot:
    # 26.6.14 (MR 11.139 B, item 8f): was priority 800, i.e. within a few hundred
    # ms of the ESP32 starting. After a POWER cycle the EZO circuits boot alongside
    # it and do EEPROM housekeeping to ~900 ms (EC changelog V1.96) / 1,000 ms
    # (datasheet mode-change reboot); a command inside that window hangs the
    # circuit mid-command (green LED, ACKs, publishes nothing - MR 11.124.4).
    # -100 runs after every component is up; the 2 s delay clears the window.
    # Deliberate divergence from upstream (which keeps 800).
    - priority: -100
      then:
        - delay: 2s
        - button.press: send_selected_ph
    - priority: 200
      then:
        - lambda: |-
            if (!id(ph_cal_mid_done)) {
              ESP_LOGW("ezo_ph", "pH sensor may not have its required MID calibration yet. Run calibration via 'pH - Command Select'.");
            }

interval:
  # Live temperature compensation: push tank temp (T,<degC>) to the pH circuit
  # each cycle. The comp temp persists while powered (resets to 25C on power
  # cycle), so the ezo component's periodic "R" reads are compensated.
  # temp_1 is in F. Skipped (with fallback to last-set/default) if the probe
  # or a valid temperature isn't available.
  - interval: "${update_ph}"
    then:
      - lambda: |-
          if (id(ph_diag_mode)) return;   // 26.6.14 (MR 11.139 G): nothing during an Export/Import
          esphome::i2c::ErrorCode err = esphome::i2c::ERROR_OK;
              // 26.6.14 (MR 11.139 C): the zero-length I2C ACK probe that stood here went
              // straight to the circuit OUTSIDE the ezo component's command queue every
              // 60 s - a start/stop at the circuit's address while it may be mid-read.
              // Candidate cause of the 09/13 pH read-path stall (MR 11.134.2). The ezo
              // component logs its own read errors; the boot-time i2c scan feeds
              // ezo_*_detected. Structure kept so the diff stays small.

          if (err != esphome::i2c::ERROR_OK) return;
          float tF = id(temp_1).state;
          if (!isnan(tF) && tF > 32.0f && tF < 110.0f) {
            float tC = (tF - 32.0f) * 5.0f / 9.0f;
            char cmd[16];
            snprintf(cmd, sizeof(cmd), "T,%.2f", tC);
            id(ph_ezo).send_custom(cmd);
          }
          else {
            ESP_LOGW("ezo_ph", "Tank temperature unavailable; pH temp compensation not updated (last-set/default 25C used).");
          }

  # 26.6.14 (MR 11.139 G): diagnostic-mode watchdog. Auto-exit after 15 min.
  - interval: 60s
    then:
      - lambda: |-
          if (!id(ph_diag_mode)) { id(ph_diag_ticks) = 0; return; }
          id(ph_diag_ticks) += 1;
          if (id(ph_diag_ticks) >= 15) {
            id(ph_diag_mode) = false;
            id(ph_diag_ticks) = 0;
            id(ph_ezo).start_poller();
            ESP_LOGW("ezo_ph", "pH diagnostic mode auto-exited after 15 min (watchdog). Live reads resume; compensation re-pushes on the next cycle.");
          } else {
            ESP_LOGW("ezo_ph", "pH diagnostic mode ON for %d min - live reads PAUSED. Run 'Diagnostic Mode OFF' (auto-exit at 15).", id(ph_diag_ticks));
          }

sensor:
  # EZO Circuits (SCL/RX, SDA/TX)
  # EZO Circuit - pH
  - platform: ezo
    icon: mdi:ph
    name: "pH"
    id: ph_ezo
    address: ${addPH}
    unit_of_measurement: ""
    # 26.6.14 (MR 11.139 H, item 0a): 3 dp - the circuit reports 3 (EZO-pH V6.1) and
    # pH is the slowest channel. HA's frozen-detector floor for pH was dropped to
    # 0.0005 (0.5x the new 0.001 quantum) BEFORE this shipped - MR 11.108.9 item 1.
    accuracy_decimals: 3
    update_interval: "${update_ph}"
    state_class: "measurement"
    device_class: PH
    on_custom:
      then:
        - lambda: |-
            // Ignore empty payloads (e.g. *OK from set-type commands like T,n)
            if (!x.empty()) id(result_ph).publish_state(x);
    on_calibration:
      then:
        - lambda:
            id(result_ph).publish_state(x);
    on_device_information:
      then:
        - lambda:
            id(result_ph).publish_state(x);
    on_slope:
      then:
        - lambda:
            id(result_ph).publish_state(x);
    on_t:
      then:
        - lambda:
            id(result_ph).publish_state(x);
    web_server:
      sorting_group_id: sorting_group_ph
      sorting_weight: 10

text_sensor:
  # Selected Command Result - pH
  - platform: template
    name: pH - Command Result
    icon: mdi:data-matrix
    id: result_ph
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_ph

binary_sensor:
  - platform: template
    name: "pH - Calibrated (MID)"
    id: ph_cal_mid_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ph_cal_mid_done);
    web_server:
      sorting_group_id: sorting_group_ph

  - platform: template
    name: "pH - Calibrated (LOW)"
    id: ph_cal_low_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ph_cal_low_done);
    web_server:
      sorting_group_id: sorting_group_ph

  - platform: template
    name: "pH - Calibrated (HIGH)"
    id: ph_cal_high_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ph_cal_high_done);
    web_server:
      sorting_group_id: sorting_group_ph

button:
  # Read pH Probe
  - platform: template
    name: pH - Read
    id: read_ph
    icon: mdi:read
    entity_category: "Config"
    # disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            esphome::i2c::ErrorCode err = esphome::i2c::ERROR_OK;
              // 26.6.14 (MR 11.139 C): the zero-length I2C ACK probe that stood here went
              // straight to the circuit OUTSIDE the ezo component's command queue every
              // 60 s - a start/stop at the circuit's address while it may be mid-read.
              // Candidate cause of the 09/13 pH read-path stall (MR 11.134.2). The ezo
              // component logs its own read errors; the boot-time i2c scan feeds
              // ezo_*_detected. Structure kept so the diff stays small.

            if (err == esphome::i2c::ERROR_OK) {
              id(ph_ezo).send_custom("R");
            }
            else {
              ESP_LOGW("custom_ph_read", "No pH sensor detected at address: ${addPH}!!");
            }
    web_server:
      sorting_group_id: sorting_group_ph

  # Send Selected EZO Command - pH
  - platform: template
    name: pH - Command Send Selected
    id: send_selected_ph
    entity_category: "Config"
    icon: mdi:apple-keyboard-command
    # disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            if (id(select_command_ph).current_option() == "Read") {
              id(ph_ezo).send_custom("R");
              ESP_LOGD("ezo_ph", "pH read command sent. Check 'pH - Command Result' for response.");
            }
            // Get Device Firmware Version
            else if (id(select_command_ph).current_option() == "Information") {
              id(ph_ezo).get_device_information();
              ESP_LOGD("ezo_ph", "pH information command sent. Check 'pH - Command Result' for response.");
            }
            else if (id(select_command_ph).current_option() == "Status") {
              id(ph_ezo).send_custom("Status");
              ESP_LOGD("ezo_ph", "pH status command sent. Check 'pH - Command Result' for response.");
            }
            else if (id(select_command_ph).current_option() == "Get Slope") {
              id(ph_ezo).get_slope();
              ESP_LOGD("ezo_ph", "pH slope check sent. Check 'pH - Command Result' for response.");
            }
            else if (id(select_command_ph).current_option() == "Get Temperature Compensation") {
              id(ph_ezo).get_t();
              ESP_LOGD("ezo_ph", "pH temp compensation query sent. Check 'pH - Command Result' for response.");
            }
            else if (id(select_command_ph).current_option() == "Check Calibration") {
              id(ph_ezo).get_calibration();
              ESP_LOGD("ezo_ph", "pH calibration check sent. Check 'pH - Command Result' for response.");
            }
            else if (id(select_command_ph).current_option() == "Calibrate @ MID = 7 (WILL RESET CALIBRATION)") {
              id(ph_ezo).set_calibration_point_mid(7.00);
              id(ph_cal_mid_done) = true;
              id(ph_cal_low_done) = false;
              id(ph_cal_high_done) = false;
              ESP_LOGI("ezo_ph", "pH calibration sent: MID = 7.00");
            }
            else if (id(select_command_ph).current_option() == "Calibrate @ LOW = 4 (WILL RESET CALIBRATION)") {
              id(ph_ezo).set_calibration_point_low(4.00);
              id(ph_cal_low_done) = true;
              ESP_LOGI("ezo_ph", "pH calibration sent: LOW = 4.00. Check 'pH - Command Result' for confirmation.");
            }
            else if (id(select_command_ph).current_option() == "Calibrate @ HIGH = 10 (WILL RESET CALIBRATION)") {
              id(ph_ezo).set_calibration_point_high(10.00);
              id(ph_cal_high_done) = true;
              ESP_LOGI("ezo_ph", "pH calibration sent: HIGH = 10.00. Check 'pH - Command Result' for confirmation.");
            }
            else if (id(select_command_ph).current_option() == "Calibrate @ HIGH = 10.01 (WILL RESET CALIBRATION)") {
              id(ph_ezo).set_calibration_point_high(10.01);
              id(ph_cal_high_done) = true;
              ESP_LOGI("ezo_ph", "pH calibration sent: HIGH = 10.01. Check 'pH - Command Result' for confirmation.");
            }
            else if (id(select_command_ph).current_option() == "Calibrate CLEAR (WILL RESET CALIBRATION)") {
              id(ph_ezo).clear_calibration();
              id(ph_cal_mid_done) = false;
              id(ph_cal_low_done) = false;
              id(ph_cal_high_done) = false;
              ESP_LOGI("ezo_ph", "pH calibration CLEARED. All calibration points reset.");
            }
            // ---- 26.6.14 (MR 11.139 G): calibration backup / restore, EZO datasheets ----
            else if (id(select_command_ph).current_option() == "Export Calibration - Info") {
              // Export,? answers "?EXPORT,<lines>,<bytes>". The count is circuit- and
              // firmware-specific (DO V2.17 answered 7,78 on 09/13/26) - READ IT, never
              // assume. Then press 'Export Calibration - Next Line' that many times and
              // record every line IN ORDER; the last press answers *DONE. Any other
              // command in between restarts the export, which is why the poller and the
              // compensation interval are paused while diagnostic mode is on.
              id(ph_diag_mode) = true; id(ph_diag_ticks) = 0;
              id(ph_ezo).stop_poller();
              id(ph_ezo).send_custom("Export,?");
              ESP_LOGW("ezo_ph", "pH Export info sent. Diagnostic mode ON (live reads paused). Read the header count from 'pH - Command Result'.");
            }
            else if (id(select_command_ph).current_option() == "Export Calibration - Next Line") {
              id(ph_diag_mode) = true;
              id(ph_ezo).stop_poller();
              id(ph_ezo).send_custom("Export");
              ESP_LOGW("ezo_ph", "pH Export line sent. Read 'pH - Command Result' BEFORE pressing again - each press overwrites the last. Stop at *DONE.");
            }
            else if (id(select_command_ph).current_option() == "Import Calibration - Send Line") {
              // Send the exported strings back in order; the circuit REBOOTS after the
              // final line. A mistyped line is rejected and nothing is imported.
              std::string s = id(ph_import_string).state;
              if (s.empty()) {
                ESP_LOGE("ezo_ph", "pH Import aborted: 'pH - Import String' is empty. Put one exported line in it first.");
              } else {
                id(ph_diag_mode) = true; id(ph_diag_ticks) = 0;
                id(ph_ezo).stop_poller();
                std::string cmd = "Import," + s;
                id(ph_ezo).send_custom(cmd.c_str());
                ESP_LOGW("ezo_ph", "pH Import line sent. The circuit reboots after the LAST line of the set.");
              }
            }
            else if (id(select_command_ph).current_option() == "Diagnostic Mode OFF") {
              id(ph_diag_mode) = false; id(ph_diag_ticks) = 0;
              id(ph_ezo).start_poller();
              ESP_LOGI("ezo_ph", "pH diagnostic mode OFF. Live reads resume.");
            }
            else if (id(select_command_ph).current_option() == "Factory Reset") {
              id(ph_ezo).send_custom("Factory");
              id(ph_cal_mid_done) = false;
              id(ph_cal_low_done) = false;
              id(ph_cal_high_done) = false;
              ESP_LOGW("ezo_ph", "pH Factory Reset sent! Device has been reset to factory defaults.");
            }
    web_server:
      sorting_group_id: sorting_group_ph

  - platform: template
    name: "pH - Reset Calibration Flags"
    id: ph_cal_reset_flags
    icon: mdi:flag-remove
    entity_category: "Config"
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(ph_cal_mid_done) = false;
          id(ph_cal_low_done) = false;
          id(ph_cal_high_done) = false;
          ESP_LOGI("ezo_ph", "pH calibration flags manually reset.");
    web_server:
      sorting_group_id: sorting_group_ph

select:
  - platform: template
    name: pH - Command Select
    id: select_command_ph
    icon: mdi:apple-keyboard-command
    optimistic: true
    # disabled_by_default: true
    entity_category: "Config"
    options:
      - "Read"
      - "Information"
      - "Status"
      - "Get Slope"
      - "Get Temperature Compensation"
      - "Check Calibration"
      - "Calibrate @ MID = 7 (WILL RESET CALIBRATION)"
      - "Calibrate @ LOW = 4 (WILL RESET CALIBRATION)"
      - "Calibrate @ HIGH = 10 (WILL RESET CALIBRATION)"
      - "Calibrate @ HIGH = 10.01 (WILL RESET CALIBRATION)"
      - "Calibrate CLEAR (WILL RESET CALIBRATION)"
      # 26.6.14 (MR 11.139 G): calibration backup/restore. Poller paused while on.
      - "Export Calibration - Info"
      - "Export Calibration - Next Line"
      - "Import Calibration - Send Line"
      - "Diagnostic Mode OFF"
      - "Factory Reset"
    initial_option: "Check Calibration"
    set_action:
      - logger.log:
          format: "Chosen option: %s"
          args: ["x.c_str()"]
    web_server:
      sorting_group_id: sorting_group_ph

text:
  # Paste ONE exported calibration line here, then run
  # "Import Calibration - Send Line" from 'pH - Command Select'. Order matters;
  # send the lines in the order they were exported. Never Import during a calibration.
  - platform: template
    name: "pH - Import String"
    id: ph_import_string
    optimistic: true
    mode: text
    min_length: 0
    max_length: 32
    entity_category: "Config"
    icon: mdi:content-paste
    web_server:
      sorting_group_id: sorting_group_ph
