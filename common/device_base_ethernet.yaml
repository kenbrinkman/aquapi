---
# =============================================================================
# device_base_ethernet.yaml
# WiFi-free variant of device_base.yaml for wired (W5500) AquaPi builds.
# Differences vs. stock device_base.yaml:
#   - removed: wifi, captive_portal, improv_serial
#   - removed: wifi_signal sensor, wifi % copy sensor, wifi_info text_sensor
#   - added:   ethernet_info text_sensor (IP / MAC diagnostics)
# Everything else is identical to device_base.yaml.
# =============================================================================
substitutions:
  # names
  name: "esp32"
  friendly_name: "ESP32"
  comment: "Firmware for ESP32"
  project_name: "USER.REPO"

  # App Version
  app_version: "1.0"
  # github URL
  github_url: "https://github.com/"
  # Logger Level - Can use VERBOSE for more information in Logs
  logger: "INFO"

  # I2C pins
  sdaPin: "21"  # yellow/TX PMP -> green
  sclPin: "22"  # blue/RX PMP -> white

  sorting_group_name: ""
  sorting_group_misc_weight: '97'
  sorting_group_diagnostic_weight: '98'
  sorting_group_config_weight: '99'

esphome:
  min_version: 2024.6.0
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Automatically add the mac address to the name
  name_add_mac_suffix: false
  comment: "${comment}"
  project:
    name: "${project_name}"
    version: "${app_version}"

# Enable logging
logger:
  level: "${logger}"

# i2c Pins
i2c:
  sda: ${sdaPin}
  scl: ${sclPin}
  scan: true
  id: bus_a

# NOTE: No wifi / captive_portal / improv_serial here — networking is provided
# by the ethernet package (common/ethernet.yaml).

ota:
  - platform: esphome

web_server:
  version: 3
  sorting_groups:
    - id: sorting_group_diagnostic
      name: "${sorting_group_name}Diagnostic"
      sorting_weight: ${sorting_group_diagnostic_weight}
    - id: sorting_group_config
      name: "AquaPi Configuration"
      sorting_weight: ${sorting_group_config_weight}
    - id: sorting_group_misc
      name: "Misc. Sensors"
      sorting_weight: ${sorting_group_misc_weight}

# Internal Blue LED
light:
  - platform: status_led
    id: internal_led
    pin:
      number: GPIO2
      ignore_strapping_warning: true

sensor:
  # Internal Temp.
  - platform: internal_temperature
    name: "Internal Temperature"
    icon: mdi:thermometer
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # Uptime sensor
  - platform: uptime
    name: Uptime
    web_server:
      sorting_group_id: sorting_group_diagnostic

binary_sensor:
  # API Status
  - platform: status
    name: "Status"
    icon: mdi:check-circle
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  # App Version
  - platform: template
    name: "App Version"
    id: app_version
    icon: mdi:update
    lambda: |-
      return {"${app_version}"};
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # GitHub Project URL
  - platform: template
    name: GitHub
    id: github_url
    icon: mdi:github
    lambda: |-
      return {"${github_url}"};
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # Hostname
  - platform: template
    name: "Hostname"
    id: hostname
    icon: mdi:cellphone-arrow-down
    lambda: |-
      return {"${name}"};
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # Ethernet Info (replaces wifi_info)
  - platform: ethernet_info
    ip_address:
      name: IP Address
      icon: mdi:ip-network
      web_server:
        sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: Mac Address
      icon: mdi:chip
      web_server:
        sorting_group_id: sorting_group_diagnostic

button:
  # Soft Restart
  - platform: restart
    id: restart_button
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_config

  # Factory Reset
  - platform: factory_reset
    name: Factory Reset (USE WITH CAUTION)
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_config

  # Safe Mode Restart
  - platform: safe_mode
    name: "Restart in Safe Mode"
    id: restart_safe
    web_server:
      sorting_group_id: sorting_group_config

  # Shutdown
  - platform: shutdown
    name: "Shutdown"
    disabled_by_default: true
    id: shutdown_button
    web_server:
      sorting_group_id: sorting_group_config
