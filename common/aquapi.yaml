---
substitutions:
  # App Version
  # NOTE: THIS is the live app_version. common/aquapi_app_version.yaml was
  # removed upstream in "App version rework (#147)" and is included by nothing —
  # editing that file has no effect. Bump here.
  # 26.6.7 = EZO Plock buttons + trimmed I2C presence detection (2026-07-26)
  app_version: "26.6.7"
  # github URL
  github_url: "https://github.com/TheRealFalseReality/aquapi"

  # names
  name: "aquapi"
  friendly_name: "AquaPi"
  comment: "AquaPi ESP32 - Aquarium Controller & Monitor"
  project_name: "therealfalsereality.aquapi"
  sorting_group_name: "AquaPi"

  # Hardware Variant
  hardware_variant: "AquaPi Hardware Variants"

text_sensor:
  # AquaPi Version
  - id: !extend app_version
    name: "AquaPi Version"

  # Hardware Variant
  - platform: template
    name: "Hardware Variant"
    id: hardware_variant_sensor
    icon: mdi:developer-board
    lambda: |-
      return {"${hardware_variant}"};
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: sorting_group_diagnostic
