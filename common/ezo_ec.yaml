---
substitutions:
  # EC circuit, who's address is 100
  addEC: "100"
  update_ec: "60s"
  update_button_ec: "60s"

  sorting_group_ec: '31'

web_server:
  sorting_groups:
    - id: sorting_group_ec
      name: "Salinity - EZO"
      sorting_weight: ${sorting_group_ec}

globals:
  - id: ec_cal_dry_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ec_cal_low_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ec_cal_high_done
    type: bool
    restore_value: true
    initial_value: 'false'
  # 26.6.14 (MR 11.139 E, item 2k(d)): single-point anchor (Cal,one,53000). ?CAL
  # answers 1 for it, which the LOW/HIGH flags used to misread as both anchors.
  - id: ec_cal_single_done
    type: bool
    restore_value: true
    initial_value: 'false'
  # 26.6.14 (MR 11.139 F, item 2k(c)): while true, read_ec sends RT,25.00 instead
  # of the live sump temperature - for a standard at ROOM temperature only. The
  # method of record floats the pouch in the sump (MR 11.40.2, 11.137); this is a
  # convenience, not a gate. NOT restored across a reboot.
  - id: ec_hold_t25
    type: bool
    restore_value: false
    initial_value: 'false'
  # 26.6.14 (MR 11.139 G): diagnostic mode. While set, the component's poller is
  # STOPPED (stop_poller) and the compensation interval sends nothing, so an
  # Export/Import sequence is never interrupted by a T/S/R (any intervening
  # command restarts an export from line 1 - MR 11.138.3) and no diagnostic
  # reply can enter the live series (MR 11.138.2). NOT restored across a reboot.
  - id: ec_diag_mode
    type: bool
    restore_value: false
    initial_value: 'false'
  # Minutes spent in diagnostic mode; the watchdog interval auto-exits at 15 so
  # a forgotten 'Diagnostic Mode OFF' cannot leave the channel dark for hours.
  - id: ec_diag_ticks
    type: int
    restore_value: false
    initial_value: '0'

api:
  actions:
    - action: ec_change_address
      variables:
        address: int
      then:
        - lambda: |-
            id(ec_ezo).send_custom("I2C,{{address}}");
    - action: ec_read_continuous
      then:
        - repeat:
            count: 60
            then:
              - button.press: read_ec
              - delay: 1s
    - action: ec_calibrate_dry
      then:
        - lambda: |-
            id(ec_ezo).send_custom("Cal,dry");
            id(ec_cal_dry_done) = true;
    - action: ec_calibrate_low_12880
      then:
        - lambda: |-
            id(ec_ezo).send_custom("Cal,low,12880");
            id(ec_cal_low_done) = true;
    - action: ec_calibrate_high_80000
      then:
        - lambda: |-
            id(ec_ezo).send_custom("Cal,high,80000");
            id(ec_cal_high_done) = true;
    - action: ec_output_all_parameters
      then:
        - lambda: |-
            id(ec_ezo).send_custom("O,EC,1");
            id(ec_ezo).send_custom("O,TDS,1");
            id(ec_ezo).send_custom("O,S,1");
            id(ec_ezo).send_custom("O,SG,1");
    - action: ec_calibrate_low
      variables:
        value: float
      then:
        - lambda: |-
            id(ec_ezo).send_custom(("Cal,low," + to_string(value)).c_str());
    - action: ec_calibrate_high
      variables:
        value: float
      then:
        - lambda: |-
            id(ec_ezo).send_custom(("Cal,high," + to_string(value)).c_str());
    - action: ec_custom_command
      variables:
        command: string
      then:
        - lambda: |-
            id(ec_ezo).send_custom(command.c_str());

esphome:
  on_boot:
    # 26.6.14 (MR 11.139 B, item 8f): was priority 800, i.e. within a few hundred
    # ms of the ESP32 starting. After a POWER cycle the EZO circuits boot alongside
    # it and do EEPROM housekeeping to ~900 ms (EC changelog V1.96) / 1,000 ms
    # (datasheet mode-change reboot); a command inside that window hangs the
    # circuit mid-command (green LED, ACKs, publishes nothing - MR 11.124.4).
    # -100 runs after every component is up; the 2 s delay clears the window.
    # Deliberate divergence from upstream (which keeps 800).
    - priority: -100
      then:
        - delay: 2s
        - button.press: read_ec
        - button.press: send_selected_ec
    - priority: 200
      then:
        - lambda: |-
            if (!id(ec_cal_dry_done)) {
              ESP_LOGW("ezo_ec", "EC sensor may not have its required DRY calibration yet. Run calibration via 'EC - Command Select'.");
            }

interval:
  # Update Raw EC
  - interval: "${update_button_ec}"
    then:
      - button.press: read_ec

  # 26.6.14 (MR 11.139 G): diagnostic-mode watchdog. Auto-exit after 15 min.
  - interval: 60s
    then:
      - lambda: |-
          if (!id(ec_diag_mode)) { id(ec_diag_ticks) = 0; return; }
          id(ec_diag_ticks) += 1;
          if (id(ec_diag_ticks) >= 15) {
            id(ec_diag_mode) = false;
            id(ec_diag_ticks) = 0;
            id(ec_ezo).start_poller();
            ESP_LOGW("ezo_ec", "EC diagnostic mode auto-exited after 15 min (watchdog). Live reads resume; compensation re-pushes on the next cycle.");
          } else {
            ESP_LOGW("ezo_ec", "EC diagnostic mode ON for %d min - live reads PAUSED. Run 'Diagnostic Mode OFF' (auto-exit at 15).", id(ec_diag_ticks));
          }

sensor:
  # EZO Circuits (SCL/RX, SDA/TX)
  # EZO Circuit - EC
  # Conductivity
  - platform: ezo
    icon: mdi:shaker-outline
    name: "Conductivity"
    id: ec_ezo
    address: ${addEC}
    unit_of_measurement: "mS/cm"
    accuracy_decimals: 2
    update_interval: "${update_ec}"
    state_class: "measurement"
    filters:
      - lambda:
          return (x / 1000);
    web_server:
      sorting_group_id: sorting_group_ec
      sorting_weight: 13
    on_custom:
      then:
        - lambda: |-
            // Ignore empty payloads (e.g. *OK from set-type commands like T,n)
            // so derived sensors aren't blanked by a parse failure.
            if (x.empty()) return;
            // 26.6.14 (MR 11.139 D, item 2k(a)): reply routing. Every EZO diagnostic
            // reply begins '?' (?CAL, ?K, ?T, ?O, ?STATUS, ?PLOCK, ?I, ?EXPORT) and
            // *DONE begins '*'; a reading never does. Those go to the command result.
            // Export lines are bare hex, so diagnostic mode routes them too. Before
            // this, every such reply landed in raw_value_ec and blanked Salinity,
            // TDS and both SG sensors for a cycle (MR 11.105, item 2g).
            if (id(ec_diag_mode) || x[0] == '?' || x[0] == '*') {
              id(result_ec).publish_state(x);
              return;
            }
            id(raw_value_ec).publish_state(x);
    on_calibration:
      then:
        - lambda:
            id(result_ec).publish_state(x);
    on_device_information:
      then:
        - lambda:
            id(result_ec).publish_state(x);

  #  # Conductivity
  # - platform: template
  #   name: Conductivity
  #   id: sensor_conductivity
  #   icon: mdi:lightning-bolt-outline
  #   unit_of_measurement: "uS/cm"
  #   accuracy_decimals: 0
  #   update_interval: "${update_ec}"
  #   state_class: "measurement"
  #   lambda: |-
  #     std::string str = id(raw_value_ec).state;
  #     if (str.empty()) return NAN;
  #     std::vector<std::string> v;
  #     char * token;
  #     char seps[] = ",";
  #     token = strtok (&str[0],seps);
  #     while (token != NULL) {
  #       v.push_back(token);
  #       token = strtok (NULL, seps);
  #     }
  #     if (v.size() == 4) {
  #       return std::stof(v[0]);
  #     }
  #     else {
  #       return NULL;
  #     }

  # TDS
  - platform: template
    name: TDS
    id: sensor_tds
    unit_of_measurement: "g/L"
    icon: mdi:water-opacity
    accuracy_decimals: 2
    disabled_by_default: true
    update_interval: "${update_ec}"
    state_class: "measurement"
    lambda: |-
      std::string str = id(raw_value_ec).state;
      if (str.empty()) return NAN;
      std::vector<std::string> v;
      char * token;
      char seps[] = ",";
      token = strtok (&str[0],seps);
      while (token != NULL) {
        v.push_back(token);
        token = strtok (NULL, seps);
      }
      if (v.size() == 4) {
        return (std::stof(v[1]) / 1000);
      }
      else {
        return NAN;
      }
    web_server:
      sorting_group_id: sorting_group_ec
      sorting_weight: 14

  # Salinity
  - platform: template
    name: Salinity
    id: sensor_salinity
    icon: mdi:shaker-outline
    unit_of_measurement: "ppt"
    accuracy_decimals: 2
    update_interval: "${update_ec}"
    state_class: "measurement"
    lambda: |-
      std::string str = id(raw_value_ec).state;
      if (str.empty()) return NAN;
      std::vector<std::string> v;
      char * token;
      char seps[] = ",";
      token = strtok (&str[0],seps);
      while (token != NULL) {
        v.push_back(token);
        token = strtok (NULL, seps);
      }
      if (v.size() == 4) {
        return std::stof(v[2]);
      }
      else {
        return NAN;
      }
    web_server:
      sorting_group_id: sorting_group_ec
      sorting_weight: 10

  # Specific Gravity
  - platform: template
    name: Specific Gravity
    id: sensor_specific_gravity
    icon: mdi:cup-water
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: "${update_ec}"
    state_class: "measurement"
    # Derived from the salinity field (v[2], 0.01 ppt resolution) instead of the
    # EZO's own SG field (v[3]), which is only reported to 3 decimals and
    # therefore appears "stuck" (0.001 SG ~= 1.3 ppt). Density from the EOS-80
    # seawater equation of state at 25 C, as a ratio to pure water (997.047).
    lambda: |-
      std::string str = id(raw_value_ec).state;
      if (str.empty()) return NAN;
      std::vector<std::string> v;
      char * token;
      char seps[] = ",";
      token = strtok (&str[0],seps);
      while (token != NULL) {
        v.push_back(token);
        token = strtok (NULL, seps);
      }
      if (v.size() == 4) {
        float S = std::stof(v[2]);
        if (isnan(S) || S < 0.0f) return NAN;
        float rho = 997.047f
                  + 0.7592383f * S
                  - 4.202135e-3f * powf(S, 1.5f)
                  + 4.8314e-4f * S * S;
        return rho / 997.047f;
      }
      else {
        return NAN;
      }
    web_server:
      sorting_group_id: sorting_group_ec
      sorting_weight: 11

  # Specific Gravity - the EZO's own SG field (v[3]), exactly as the circuit
  # reports it, 3 decimals. Kenny's call 2026-09-08: the Command gauge reads
  # THIS one. It stair-steps by 0.001 (~1.3 ppt) - that is the circuit's
  # resolution, not a fault. The EOS-80 sensor above keeps the smooth
  # 4-decimal history for Trends and InfluxDB.
  - platform: template
    name: Specific Gravity EZO
    id: sensor_specific_gravity_ezo
    icon: mdi:cup-water
    unit_of_measurement: ""
    accuracy_decimals: 3
    update_interval: "${update_ec}"
    state_class: "measurement"
    lambda: |-
      std::string str = id(raw_value_ec).state;
      if (str.empty()) return NAN;
      std::vector<std::string> v;
      char * token;
      char seps[] = ",";
      token = strtok (&str[0],seps);
      while (token != NULL) {
        v.push_back(token);
        token = strtok (NULL, seps);
      }
      if (v.size() == 4) {
        float sg = std::stof(v[3]);
        if (isnan(sg) || sg < 0.9f || sg > 1.1f) return NAN;
        return sg;
      }
      else {
        return NAN;
      }
    web_server:
      sorting_group_id: sorting_group_ec
      sorting_weight: 12

text_sensor:
  # Conductivity Raw Value
  - platform: template
    name: EC - Raw Value
    id: raw_value_ec
    icon: mdi:counter
    # disabled_by_default: true
    on_value:
      then:
        - component.update: ec_ezo
        - component.update: sensor_salinity
        # - component.update: sensor_conductivity
        - component.update: sensor_tds
        - component.update: sensor_specific_gravity
        - component.update: sensor_specific_gravity_ezo
    web_server:
      sorting_group_id: sorting_group_ec

  # Selected Command Result - Conductivity
  - platform: template
    name: EC - Command Result
    icon: mdi:data-matrix
    id: result_ec
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_ec

binary_sensor:
  - platform: template
    name: "EC - Calibrated (DRY)"
    id: ec_cal_dry_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ec_cal_dry_done);
    web_server:
      sorting_group_id: sorting_group_ec

  - platform: template
    name: "EC - Calibrated (LOW)"
    id: ec_cal_low_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      // 26.6.14 (MR 11.139 E): a single-point anchor is not a LOW anchor.
      return id(ec_cal_low_done) && !id(ec_cal_single_done);
    web_server:
      sorting_group_id: sorting_group_ec

  - platform: template
    name: "EC - Calibrated (HIGH)"
    id: ec_cal_high_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ec_cal_high_done) && !id(ec_cal_single_done);
    web_server:
      sorting_group_id: sorting_group_ec

  - platform: template
    name: "EC - Calibrated (SINGLE)"
    id: ec_cal_single_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(ec_cal_single_done);
    web_server:
      sorting_group_id: sorting_group_ec

button:
  # Read Conductivity Probe
  - platform: template
    name: EC - Read
    icon: mdi:read
    id: read_ec
    entity_category: "Config"
    # disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            esphome::i2c::ErrorCode err = esphome::i2c::ERROR_OK;
              // 26.6.14 (MR 11.139 C): the zero-length I2C ACK probe that stood here went
              // straight to the circuit OUTSIDE the ezo component's command queue every
              // 60 s - a start/stop at the circuit's address while it may be mid-read.
              // Candidate cause of the 09/13 pH read-path stall (MR 11.134.2). The ezo
              // component logs its own read errors; the boot-time i2c scan feeds
              // ezo_*_detected. Structure kept so the diff stays small.

            if (err == esphome::i2c::ERROR_OK) {
              // Live temperature compensation: RT,<tank temp in C> sets the EZO's
              // compensation temp AND takes a reading (EC EZO datasheet pg. 27).
              // The comp temp persists while powered, so the ezo component's own
              // periodic "R" reads are compensated too. temp_1 is in F.
              // NOTE: calibrate with the solution at tank temperature (float the
              // pouch in the sump) since the comp temp tracks the tank.
              if (id(ec_diag_mode)) return;   // 26.6.14 (MR 11.139 G): nothing during an Export/Import
              float tF = id(temp_1).state;
              if (id(ec_hold_t25)) {            // 26.6.14 (MR 11.139 F): room-temperature standard
                id(ec_ezo).send_custom("RT,25.00");
              }
              else if (!isnan(tF) && tF > 32.0f && tF < 110.0f) {
                float tC = (tF - 32.0f) * 5.0f / 9.0f;
                char cmd[16];
                snprintf(cmd, sizeof(cmd), "RT,%.2f", tC);
                id(ec_ezo).send_custom(cmd);
              }
              else {
                ESP_LOGW("ezo_ec", "Tank temperature unavailable; EC read WITHOUT live temp compensation (last-set/default 25C used).");
                id(ec_ezo).send_custom("R");
              }
            }
            else {
              ESP_LOGW("custom_conductivity_read", "No Conductivity sensor detected at address: ${addEC}!");
            }
    web_server:
      sorting_group_id: sorting_group_ec

  # Send Selected EZO Command - Conductitivy
  - platform: template
    name: EC - Command Send Selected
    icon: mdi:apple-keyboard-command
    id: send_selected_ec
    entity_category: "Config"
    # disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            if (id(select_command_ec).current_option() == "Read") {
              id(ec_ezo).send_custom("R");
              ESP_LOGD("ezo_ec", "EC read command sent. Check 'EC - Command Result' for response.");
            }
            else if (id(select_command_ec).current_option() == "Information") {
              id(ec_ezo).get_device_information();
              ESP_LOGD("ezo_ec", "EC information command sent. Check 'EC - Command Result' for response.");
            }
            else if (id(select_command_ec).current_option() == "Status") {
              id(ec_ezo).send_custom("Status");
              ESP_LOGD("ezo_ec", "EC status command sent. Check 'EC - Command Result' for response.");
            }
            else if (id(select_command_ec).current_option() == "Get Probe K Value") {
              id(ec_ezo).send_custom("K,?");
            }
            else if (id(select_command_ec).current_option() == "Get TDS Value") {
              id(ec_ezo).send_custom("TDS,?");
            }
            else if (id(select_command_ec).current_option() == "Set TDS Value to NaCl - 0.48") {
              id(ec_ezo).send_custom("TDS,0.48");
            }
            else if (id(select_command_ec).current_option() == "Get Enabled Parameter(s)") {
              id(ec_ezo).send_custom("O,?");
            }
            else if (id(select_command_ec).current_option() == "Get Temperature Compensation") {
              id(ec_ezo).send_custom("T,?");
              ESP_LOGD("ezo_ec", "EC temp compensation query sent. Response appears in 'EC - Raw Value' (?T,<degC>).");
            }
            else if (id(select_command_ec).current_option() == "Set Probe Type K1") {
              id(ec_ezo).send_custom("K,1");
            }
            else if (id(select_command_ec).current_option() == "Output Units - All (Default)") {
              id(ec_ezo).send_custom("O,EC,1");
              id(ec_ezo).send_custom("O,TDS,1");
              id(ec_ezo).send_custom("O,S,1");
              id(ec_ezo).send_custom("O,SG,1");
            }
            else if (id(select_command_ec).current_option() == "Output Units - Conductivity") {
              id(ec_ezo).send_custom("O,EC,1");
              id(ec_ezo).send_custom("O,TDS,0");
              id(ec_ezo).send_custom("O,S,0");
              id(ec_ezo).send_custom("O,SG,0");
            }
            else if (id(select_command_ec).current_option() == "Output Units - Salinity") {
              id(ec_ezo).send_custom("O,EC,0");
              id(ec_ezo).send_custom("O,TDS,0");
              id(ec_ezo).send_custom("O,S,1");
              id(ec_ezo).send_custom("O,SG,0");
            }
            else if (id(select_command_ec).current_option() == "Output Units - Specific Gravity") {
              id(ec_ezo).send_custom("O,EC,0");
              id(ec_ezo).send_custom("O,TDS,0");
              id(ec_ezo).send_custom("O,S,0");
              id(ec_ezo).send_custom("O,SG,1");
            }
            else if (id(select_command_ec).current_option() == "Output Units - TDS") {
              id(ec_ezo).send_custom("O,EC,0");
              id(ec_ezo).send_custom("O,TDS,1");
              id(ec_ezo).send_custom("O,S,0");
              id(ec_ezo).send_custom("O,SG,0");
            }
            else if (id(select_command_ec).current_option() == "Check Calibration") {
              id(ec_ezo).get_calibration();
              ESP_LOGD("ezo_ec", "EC calibration check sent. Check 'EC - Command Result' for response.");
            }
            else if (id(select_command_ec).current_option() == "Calibrate @ DRY (WILL RESET CALIBRATION)") {
              id(ec_ezo).send_custom("Cal,dry");
              id(ec_cal_dry_done) = true;
              ESP_LOGI("ezo_ec", "EC calibration sent: DRY point. Check 'EC - Command Result' for confirmation.");
            }
            else if (id(select_command_ec).current_option() == "Calibrate @ LOW = 12880 (WILL RESET CALIBRATION)") {
              id(ec_ezo).send_custom("Cal,low,12880");
              id(ec_cal_low_done) = true;
              ESP_LOGI("ezo_ec", "EC calibration sent: LOW = 12880. Check 'EC - Command Result' for confirmation.");
            }
            else if (id(select_command_ec).current_option() == "Calibrate @ HIGH = 80000 (WILL RESET CALIBRATION)") {
              id(ec_ezo).send_custom("Cal,high,80000");
              id(ec_cal_high_done) = true;
              ESP_LOGI("ezo_ec", "EC calibration sent: HIGH = 80000. Check 'EC - Command Result' for confirmation.");
            }
            else if (id(select_command_ec).current_option() == "Calibrate CLEAR (WILL RESET CALIBRATION)") {
              id(ec_ezo).clear_calibration();
              id(ec_cal_dry_done) = false;
              id(ec_cal_low_done) = false;
              id(ec_cal_high_done) = false;
              ESP_LOGI("ezo_ec", "EC calibration CLEARED. All calibration points reset.");
            }
            else if (id(select_command_ec).current_option() == "Calibrate @ SINGLE POINT = 53000 (WILL RESET CALIBRATION)") {
              // 26.6.14 (MR 11.139 E, item 2k(d)). The method of record is MR 11.39.8:
              // Cal,clear -> Cal,dry (probe DRY) -> pouch floated in the sump 15-20 min ->
              // probe in the pouch until the read plateaus (8-10 min) -> THIS -> ?CAL = 1.
              id(ec_ezo).send_custom("Cal,one,53000");
              id(ec_cal_single_done) = true;
              id(ec_cal_low_done) = false;
              id(ec_cal_high_done) = false;
              ESP_LOGI("ezo_ec", "EC calibration sent: SINGLE POINT = 53000. Check Calibration should answer 1.");
            }
            else if (id(select_command_ec).current_option() == "Hold Temp Comp @ 25 C (calibration)") {
              id(ec_hold_t25) = true;
              id(ec_ezo).send_custom("T,25.00");
              ESP_LOGW("ezo_ec", "EC temp compensation HELD at 25 C for a room-temperature standard. Run 'Release Temp Comp' afterwards.");
            }
            else if (id(select_command_ec).current_option() == "Release Temp Comp") {
              id(ec_hold_t25) = false;
              ESP_LOGI("ezo_ec", "EC temp compensation released; live sump temperature resumes on the next read.");
            }
            // ---- 26.6.14 (MR 11.139 G): calibration backup / restore, EZO datasheets ----
            else if (id(select_command_ec).current_option() == "Export Calibration - Info") {
              // Export,? answers "?EXPORT,<lines>,<bytes>". The count is circuit- and
              // firmware-specific (DO V2.17 answered 7,78 on 09/13/26) - READ IT, never
              // assume. Then press 'Export Calibration - Next Line' that many times and
              // record every line IN ORDER; the last press answers *DONE. Any other
              // command in between restarts the export, which is why the poller and the
              // compensation interval are paused while diagnostic mode is on.
              id(ec_diag_mode) = true; id(ec_diag_ticks) = 0;
              id(ec_ezo).stop_poller();
              id(ec_ezo).send_custom("Export,?");
              ESP_LOGW("ezo_ec", "EC Export info sent. Diagnostic mode ON (live reads paused). Read the header count from 'EC - Command Result'.");
            }
            else if (id(select_command_ec).current_option() == "Export Calibration - Next Line") {
              id(ec_diag_mode) = true;
              id(ec_ezo).stop_poller();
              id(ec_ezo).send_custom("Export");
              ESP_LOGW("ezo_ec", "EC Export line sent. Read 'EC - Command Result' BEFORE pressing again - each press overwrites the last. Stop at *DONE.");
            }
            else if (id(select_command_ec).current_option() == "Import Calibration - Send Line") {
              // Send the exported strings back in order; the circuit REBOOTS after the
              // final line. A mistyped line is rejected and nothing is imported.
              std::string s = id(ec_import_string).state;
              if (s.empty()) {
                ESP_LOGE("ezo_ec", "EC Import aborted: 'EC - Import String' is empty. Put one exported line in it first.");
              } else {
                id(ec_diag_mode) = true; id(ec_diag_ticks) = 0;
                id(ec_ezo).stop_poller();
                std::string cmd = "Import," + s;
                id(ec_ezo).send_custom(cmd.c_str());
                ESP_LOGW("ezo_ec", "EC Import line sent. The circuit reboots after the LAST line of the set.");
              }
            }
            else if (id(select_command_ec).current_option() == "Diagnostic Mode OFF") {
              id(ec_diag_mode) = false; id(ec_diag_ticks) = 0;
              id(ec_ezo).start_poller();
              ESP_LOGI("ezo_ec", "EC diagnostic mode OFF. Live reads resume.");
            }
            else if (id(select_command_ec).current_option() == "Factory Reset") {
              id(ec_ezo).send_custom("Factory");
              id(ec_cal_dry_done) = false;
              id(ec_cal_low_done) = false;
              id(ec_cal_high_done) = false;
              id(ec_cal_single_done) = false;
              ESP_LOGW("ezo_ec", "EC Factory Reset sent! Device has been reset to factory defaults.");
            }
    web_server:
      sorting_group_id: sorting_group_ec

  - platform: template
