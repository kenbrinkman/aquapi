---
substitutions:
  # DO circuit, who's address is 97
  addDO: "97"
  update_do: "60s"
  update_button_do: "60s"

  sorting_group_do: '32'

web_server:
  sorting_groups:
    - id: sorting_group_do
      name: "Dissolved Oxygen - EZO"
      sorting_weight: ${sorting_group_do}

globals:
  - id: do_cal_dry_done
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: do_cal_zero_done
    type: bool
    restore_value: true
    initial_value: 'false'
  # Diagnostic routing (Master Reference 11.102). When true, EZO payloads go to
  # 'DO - Command Result' ONLY and are kept OUT of raw_value_do, so Export strings
  # and deliberately uncompensated verification reads never enter the live DO
  # series. NOT restored across a reboot - normal reads must resume on their own.
  - id: do_diag_mode
    type: bool
    restore_value: false
    initial_value: 'false'

api:
  actions:
    - action: do_change_address
      variables:
        address: int
      then:
        - lambda: |-
            id(do_ezo).send_custom("I2C,{{address}}");
    - action: do_read_continuous
      then:
        - repeat:
            count: 60
            then:
              - button.press: read_do
              - delay: 1s
    - action: do_calibrate_dry
      then:
        - lambda: |-
            id(do_ezo).send_custom("Cal");
            id(do_cal_dry_done) = true;
    - action: do_calibrate_0
      then:
        - lambda: |-
            id(do_ezo).send_custom("Cal,0");
            id(do_cal_zero_done) = true;
    - action: do_salinity_compensation_35ppt
      then:
        - lambda: |-
            id(do_ezo).send_custom("S,35.0,ppt");
    - action: do_output_all_parameters
      then:
        - lambda: |-
            id(do_ezo).send_custom("O,mg,1");
            id(do_ezo).send_custom("O,%,1");
    - action: do_custom_command
      variables:
        command: string
      then:
        - lambda: |-
            id(do_ezo).send_custom(command.c_str());

esphome:
  on_boot:
    - priority: 800
      then:
        - button.press: read_do
        - button.press: send_selected_do
    - priority: 200
      then:
        - lambda: |-
            if (!id(do_cal_dry_done) && !id(do_cal_zero_done)) {
              ESP_LOGW("ezo_do", "DO sensor may not be calibrated! Run calibration via 'DO - Command Select'.");
            }


interval:
  # Update Raw DO
  - interval: "${update_button_do}"
    then:
      - button.press: read_do

sensor:
  # EZO Circuits (SCL/RX, SDA/TX)
  # EZO Circuit - DO
  # Dissolved Oxygen mg/L
  - platform: ezo
    icon: mdi:gas-cylinder
    name: "Dissolved Oxygen"
    id: do_ezo
    address: ${addDO}
    unit_of_measurement: "mg/L"
    accuracy_decimals: 2
    update_interval: "${update_do}"
    state_class: "measurement"
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_do
      sorting_weight: 10
    on_custom:
      then:
        - lambda: |-
            // Ignore empty payloads (e.g. *OK from set-type commands like T,n / S,n)
            // so derived sensors aren't blanked by a parse failure.
            if (x.empty()) return;
            // Diagnostic mode: Export strings and defaults-verification reads are NOT
            // tank data. Route them to the command result and leave the live series
            // untouched. See Master Reference 11.102.
            if (id(do_diag_mode)) {
              id(result_do).publish_state(x);
              return;
            }
            id(raw_value_do).publish_state(x);
    on_calibration:
      then:
        - lambda:
            id(result_do).publish_state(x);
    on_device_information:
      then:
        - lambda:
            id(result_do).publish_state(x);

  # Dissolved Oxygen % Saturation
  - platform: template
    name: "Dissolved Oxygen % Saturation"
    id: sensor_do_percent
    unit_of_measurement: "%"
    icon: mdi:gas-cylinder
    accuracy_decimals: 1
    update_interval: "${update_do}"
    state_class: "measurement"
    web_server:
      sorting_group_id: sorting_group_do
      sorting_weight: 11
    lambda: |-
      std::string str = id(raw_value_do).state;
      if (str.empty()) return NAN;
      std::vector<std::string> v;
      char * token;
      char seps[] = ",";
      token = strtok (&str[0],seps);
      while (token != NULL) {
        v.push_back(token);
        token = strtok (NULL, seps);
      }
      if (v.size() == 2) {
        return (std::stof(v[1]));
      }
      else {
        return NAN;
      }

text_sensor:
  # Dissolved Oxygen Raw Value
  - platform: template
    name: DO - Raw Value
    id: raw_value_do
    icon: mdi:counter
    # disabled_by_default: true
    on_value:
      then:
        - component.update: do_ezo
        - component.update: sensor_do_percent
    web_server:
      sorting_group_id: sorting_group_do

  # Selected Command Result - Dissolved Oxygen
  - platform: template
    name: DO - Command Result
    icon: mdi:data-matrix
    id: result_do
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_do

binary_sensor:
  - platform: template
    name: "DO - Calibrated (DRY)"
    id: do_cal_dry_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(do_cal_dry_done);
    web_server:
      sorting_group_id: sorting_group_do

  - platform: template
    name: "DO - Calibrated (0%)"
    id: do_cal_zero_sensor
    icon: mdi:check-circle
    entity_category: "diagnostic"
    lambda: |-
      return id(do_cal_zero_done);
    web_server:
      sorting_group_id: sorting_group_do

button:
  # Read DO Probe
  - platform: template
    name: DO - Read
    icon: mdi:read
    id: read_do
    entity_category: "Config"
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_do
    on_press:
      then:
        - lambda: |-
            esphome::i2c::ErrorCode err = id(bus_a)->write(${addDO}, nullptr, 0);
            if (err == esphome::i2c::ERROR_OK) {
              // Live compensation before each read (DO EZO datasheet):
              //  - T,<degC>: temp comp (default 20C, not retained on power cycle).
              //    Plain T,n + R is used instead of RT,n (RT needs firmware >= 2.13).
              //  - S,<ppt>,ppt: salinity comp from the EC circuit's live salinity
              //    (~20% mg/L error at reef salinity if left at default 0).
              // temp_1 is in F; sensor_salinity comes from common/ezo_ec.yaml.
              float tF = id(temp_1).state;
              if (!isnan(tF) && tF > 32.0f && tF < 110.0f) {
                float tC = (tF - 32.0f) * 5.0f / 9.0f;
                char cmd[16];
                snprintf(cmd, sizeof(cmd), "T,%.2f", tC);
                id(do_ezo).send_custom(cmd);
              }
              else {
                ESP_LOGW("ezo_do", "Tank temperature unavailable; DO temp compensation not updated (last-set/default 20C used).");
              }
              float S = id(sensor_salinity).state;
              if (!isnan(S) && S >= 0.0f && S <= 45.0f) {
                char cmd[20];
                snprintf(cmd, sizeof(cmd), "S,%.1f,ppt", S);
                id(do_ezo).send_custom(cmd);
              }
              id(do_ezo).send_custom("R");
            }
            else {
              ESP_LOGW("custom_do_read", "No Dissolved Oxygen sensor detected at address: ${addDO}!");
            }

  # Send Selected EZO Command - Dissolved Oxygen
  - platform: template
    name: DO - Command Send Selected
    icon: mdi:apple-keyboard-command
    id: send_selected_do
    entity_category: "Config"
    # disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_do
    on_press:
      then:
        - lambda: |-
            if (id(select_command_do).current_option() == "Read") {
              id(do_ezo).send_custom("R");
              ESP_LOGD("ezo_do", "DO read command sent. Check 'DO - Command Result' for response.");
            }
            else if (id(select_command_do).current_option() == "Information") {
              id(do_ezo).get_device_information();
              ESP_LOGD("ezo_do", "DO information command sent. Check 'DO - Command Result' for response.");
            }
            else if (id(select_command_do).current_option() == "Status") {
              id(do_ezo).send_custom("Status");
              ESP_LOGD("ezo_do", "DO status command sent. Check 'DO - Command Result' for response.");
            }
            else if (id(select_command_do).current_option() == "Get Enabled Parameter(s)") {
              id(do_ezo).send_custom("O,?");
            }
            else if (id(select_command_do).current_option() == "Output Units - All (Default)") {
              id(do_ezo).send_custom("O,mg,1");
              id(do_ezo).send_custom("O,%,1");
            }
            else if (id(select_command_do).current_option() == "Output Units - % Saturation") {
              id(do_ezo).send_custom("O,mg,0");
              id(do_ezo).send_custom("O,%,1");
            }
            else if (id(select_command_do).current_option() == "Output Units - mg/L") {
              id(do_ezo).send_custom("O,mg,1");
              id(do_ezo).send_custom("O,%,0");
            }
            else if (id(select_command_do).current_option() == "Check Calibration") {
              id(do_ezo).get_calibration();
              ESP_LOGD("ezo_do", "DO calibration check sent. Check 'DO - Command Result' for response.");
            }
            else if (id(select_command_do).current_option() == "Calibrate @ DRY (WILL RESET CALIBRATION)") {
              id(do_ezo).send_custom("Cal");
              id(do_cal_dry_done) = true;
              ESP_LOGI("ezo_do", "DO calibration sent: DRY point. Check 'DO - Command Result' for confirmation.");
            }
            else if (id(select_command_do).current_option() == "Calibrate @ 0% (WILL RESET CALIBRATION)") {
              id(do_ezo).send_custom("Cal,0");
              id(do_cal_zero_done) = true;
              ESP_LOGI("ezo_do", "DO calibration sent: 0%% saturation. Check 'DO - Command Result' for confirmation.");
            }
            else if (id(select_command_do).current_option() == "Calibrate CLEAR (WILL RESET CALIBRATION)") {
              id(do_ezo).clear_calibration();
              id(do_cal_dry_done) = false;
              id(do_cal_zero_done) = false;
              ESP_LOGI("ezo_do", "DO calibration CLEARED. All calibration points reset.");
            }
            else if (id(select_command_do).current_option() == "Salinity Compensation Value" || id(select_command_do).current_option() == "Get Salinity Compensation") {
              id(do_ezo).send_custom("S,?");
            }
            else if (id(select_command_do).current_option() == "Get Temperature Compensation") {
              id(do_ezo).send_custom("T,?");
            }
            else if (id(select_command_do).current_option() == "Set Salinity Compensation @ 35ppt") {
              id(do_ezo).send_custom("S,35.0,ppt");
            }
            else if (id(select_command_do).current_option() == "Verify Cal @ Atlas Defaults (T,20 / S,0)") {
              // EZO-DO datasheet V5.8 p.63 "Calibrate first, compensate later", and
              // p.65: a good air Cal reads 9.09-9.1X mg/L ONLY at default compensation.
              // Pressure is deliberately NOT sent - this firmware never writes P,n, so
              // the circuit already sits at its own default. Do not invent a value here.
              id(do_diag_mode) = true;
              id(do_ezo).send_custom("T,20.0");
              id(do_ezo).send_custom("S,0");
              id(do_ezo).send_custom("R");
              ESP_LOGW("ezo_do", "DO defaults read-back armed. EXPECT 9.09-9.1X mg/L if the air Cal is good. Result goes to 'DO - Command Result'; live DO sensors are NOT updated. Run 'Restore Live Compensation' when done.");
            }
            else if (id(select_command_do).current_option() == "Restore Live Compensation") {
              id(do_diag_mode) = false;
              float tF = id(temp_1).state;
              if (!isnan(tF) && tF > 32.0f && tF < 110.0f) {
                float tC = (tF - 32.0f) * 5.0f / 9.0f;
                char cmd[16];
                snprintf(cmd, sizeof(cmd), "T,%.2f", tC);
                id(do_ezo).send_custom(cmd);
              }
              float S = id(sensor_salinity).state;
              if (!isnan(S) && S >= 0.0f && S <= 45.0f) {
                char cmd[20];
                snprintf(cmd, sizeof(cmd), "S,%.1f,ppt", S);
                id(do_ezo).send_custom(cmd);
              }
              ESP_LOGI("ezo_do", "DO live compensation restored, diagnostic mode OFF. Normal reads resume.");
            }
            else if (id(select_command_do).current_option() == "Export Calibration - Info") {
              // EZO-DO datasheet V5.8 p.48: Export,? returns "<strings>,<bytes>",
              // normally 10,120. Then press 'Export Calibration - Next Line' that many
              // times; the final response is *DONE.
              id(do_diag_mode) = true;
              id(do_ezo).send_custom("Export,?");
              ESP_LOGW("ezo_do", "DO Export info sent (expect 10,120). Diagnostic mode ON. Record EVERY line from 'DO - Command Result' IN ORDER - a partial set is worthless.");
            }
            else if (id(select_command_do).current_option() == "Export Calibration - Next Line") {
              id(do_diag_mode) = true;
              id(do_ezo).send_custom("Export");
              ESP_LOGW("ezo_do", "DO Export line sent. Read 'DO - Command Result' BEFORE pressing again - each press overwrites the last. Stop at *DONE.");
            }
            else if (id(select_command_do).current_option() == "Import Calibration - Send Line") {
              // EZO-DO datasheet V5.8 p.49: send the exported strings back in order.
              // The circuit REBOOTS after the final line. A mistyped line is rejected
              // and the device reboots having imported nothing - start the set over.
              std::string s = id(do_import_string).state;
              if (s.empty()) {
                ESP_LOGE("ezo_do", "DO Import aborted: 'DO - Import String' is empty. Put one exported line in it first.");
              } else {
                id(do_diag_mode) = true;
                std::string cmd = "Import," + s;
                id(do_ezo).send_custom(cmd.c_str());
                ESP_LOGW("ezo_do", "DO Import line sent. The circuit reboots after the LAST line of the set.");
              }
            }
            else if (id(select_command_do).current_option() == "Diagnostic Mode OFF") {
              id(do_diag_mode) = false;
              ESP_LOGI("ezo_do", "DO diagnostic mode OFF. Payloads resume publishing to the live DO sensors.");
            }
            else if (id(select_command_do).current_option() == "Factory Reset") {
              id(do_ezo).send_custom("Factory");
              id(do_cal_dry_done) = false;
              id(do_cal_zero_done) = false;
              ESP_LOGW("ezo_do", "DO Factory Reset sent! Device has been reset to factory defaults.");
            }

  - platform: template
    name: "DO - Reset Calibration Flags"
    id: do_cal_reset_flags
    icon: mdi:flag-remove
    entity_category: "Config"
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(do_cal_dry_done) = false;
          id(do_cal_zero_done) = false;
          ESP_LOGI("ezo_do", "DO calibration flags manually reset.");
    web_server:
      sorting_group_id: sorting_group_do

select:
  - platform: template
    name: DO - Command Select
    id: select_command_do
    icon: mdi:apple-keyboard-command
    # disabled_by_default: true
    optimistic: true
    entity_category: "Config"
    options:
      - "Read"
      - "Information"
      - "Status"
      - "Get Enabled Parameter(s)"
      - "Output Units - All (Default)"
      - "Output Units - % Saturation"
      - "Output Units - mg/L"
      - "Check Calibration"
      - "Calibrate @ 0% (WILL RESET CALIBRATION)"
      - "Calibrate @ DRY (WILL RESET CALIBRATION)"
      - "Calibrate CLEAR (WILL RESET CALIBRATION)"
      - "Get Temperature Compensation"
      # Legacy option name retained for backward compatibility; migrate automations to
      # "Get Salinity Compensation" when possible.
      - "Salinity Compensation Value"
      - "Get Salinity Compensation"
      - "Set Salinity Compensation @ 35ppt"
      # Added 09/11/26 - Master Reference 11.102. Verification and calibration
      # backup, both straight from EZO-DO datasheet V5.8 (p.48, p.49, p.63, p.65).
      - "Verify Cal @ Atlas Defaults (T,20 / S,0)"
      - "Restore Live Compensation"
      - "Export Calibration - Info"
      - "Export Calibration - Next Line"
      - "Import Calibration - Send Line"
      - "Diagnostic Mode OFF"
      - "Factory Reset"
    initial_option: "Check Calibration"
    set_action:
      - logger.log:
          format: "Chosen option: %s"
          args: ["x.c_str()"]
    web_server:
      sorting_group_id: sorting_group_do

text:
  # Paste ONE exported calibration line here, then run
  # "Import Calibration - Send Line" from 'DO - Command Select'.
  # EZO-DO datasheet V5.8 p.48: export strings are up to 12 characters each,
  # 10 strings / 120 bytes for a full set. Order matters; send them 1 through 10.
  - platform: template
    name: "DO - Import String"
    id: do_import_string
    optimistic: true
    mode: text
    min_length: 0
    max_length: 32
    entity_category: "Config"
    icon: mdi:content-paste
    web_server:
      sorting_group_id: sorting_group_do
