---
# =============================================================================
# Dallas DS18B20 temperature — ADDRESS-BASED (replaces temperature_dallas_index.yaml)
# =============================================================================
# Why address instead of index:
#   With `index:`, the probes are numbered by their position in the ROM-sorted
#   scan order. If a probe dies or is unplugged, the survivor is promoted to
#   index 0 — so "Temperature" silently starts reporting the *other* probe, and
#   its baked-in calibration is now applied to the wrong sensor. With
#   `address:`, a missing probe simply goes unavailable and the other one keeps
#   reporting itself. Probe swaps become explicit (edit the address here).
#
# HOW TO GET THE ADDRESSES (done 2026-07-30 — kept for the next rebuild):
#   1. Flash with the existing index-based file still included.
#   2. GOTCHA: the bus dump is logged at CONFIG level, which is SUPPRESSED at
#      the default logger level of INFO set in common/device_base_ethernet.yaml.
#      Set `logger: "DEBUG"` in the top-level substitutions of the device YAML
#      first, or the dump never reaches the log and it looks like the reboot
#      failed. Revert to INFO once captured.
#   3. Open the ESPHome logs and look for the one_wire bus dump at boot:
#        [C][gpio.one_wire:020]: GPIO 1-wire bus:
#        [C][gpio.one_wire:087]:   Found devices:
#        [C][gpio.one_wire:090]:     0x8a00000023e44428 (DS18B20)
#        [C][gpio.one_wire:090]:     0xbf00000021744328 (DS18B20)
#      The later [C][dallas.temp.sensor:033] lines are more useful still —
#      they print the address each sensor actually resolved to, in YAML order,
#      which maps index -> address without any guessing.
#   4. Identify which is which: put ONE probe in a cup of warm water, watch
#      which entity moves. Label that physical probe with a tag.
#   5. Paste the addresses below, swap the include, re-flash.
#
# NOTE: the 4.7 kΩ 1-wire pull-up is ALREADY on the AquaPi board (R3, between
# DATA and 3V3). Do not add another — a second pull-up in parallel halves the
# effective resistance and can corrupt reads on longer runs.
# =============================================================================

substitutions:
  dallasPin: "16"
  update_temp: "60s"

  # --- Probe ROM addresses -----------------------------------------------
  # 64-bit 1-wire ROM codes, captured from the boot log 2026-07-30 23:57
  # after the REV D.2 junction box rebuild. Both enumerated on GPIO16 at
  # 12-bit resolution.
  #
  # VERIFIED 2026-07-30 by hand-warming the probe in the junction box's T1
  # terminal: 'Temperature 2' rose to 33.94°C while 'Temperature' held at
  # 25.56°C. So the T1 terminal is 0xbf...4328.
  #
  # DO NOT infer the mapping from the order of the [C][dallas.temp.sensor:033]
  # dump lines — those print in ROM-sorted bus order, NOT YAML declaration
  # order, so reading them top-to-bottom as temp_1/temp_2 gives you the probes
  # swapped. Only the hand-warm test is authoritative. (Consistent with the
  # 1-wire search order: 0xbf..4328 sorts before 0x8a..4428 LSB-first, so the
  # T1 terminal was index 0 under the old index-based config too.)
  addr_temp_1: "0xbf00000021744328"  # T1 terminal on the junction box
  addr_temp_2: "0x8a00000023e44428"  # T2 terminal on the junction box

  # Calibration variables
  # 0C using Ice Water; 100C using Boiling Water
  # (calibration happens in °C, before the °F conversion filter)
  #
  # Calibration Temp. 1
  # RESET 2026-07-28 for the rebuilt probe harness. The previous
  # cal_0/cal_100 of 0.389/100.389 was a +0.7°F bias offset derived on
  # 2026-07-08 against the OLD T2 as reference — that reference probe is
  # dead and both probes are being re-terminated, so the old offset is
  # meaningless. Re-derive after the rebuild: let both probes settle in the
  # same water, then bias whichever reads low.
  cal_0: "0.0"
  cal_100: "100.0"
  # Cool/Warm thresholds in °F (was 23.5/28 °C)
  range_cool: "74.3"
  range_warm: "82.4"

  # Calibration Temp. 2
  cal_0_temp_2: "0.0"
  cal_100_temp_2: "100.0"
  range_cool_2: "74.3"
  range_warm_2: "82.4"

  sorting_group_temperature_weight: '10'

web_server:
  sorting_groups:
    - id: sorting_group_temperature
      name: "Temperature"
      sorting_weight: ${sorting_group_temperature_weight}

# 18B20 sensor Pin
one_wire:
  - platform: gpio
    pin: ${dallasPin}

sensor:
  # Temperature Probe 1 - pinned to its ROM address
  - platform: dallas_temp
    address: ${addr_temp_1}
    id: temp_1
    icon: mdi:thermometer-water
    name: "Temperature"
    state_class: "measurement"
    device_class: "temperature"
    unit_of_measurement: "°F"
    update_interval: "${update_temp}"
    filters:
      - filter_out: NAN
      # Reject implausible raw readings (°C, pre-calibration):
      # 85.0 = DS18B20 power-on-reset default, 0.0 = bus glitch.
      # Anything outside 4-40°C (39-104°F) is not a real tank temp.
      - lambda: |-
          if (x < 4.0 || x > 40.0) return {};
          return x;
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 0.0 -> ${cal_0}
            - 100.0 -> ${cal_100}
      # Convert to Fahrenheit (calibration above stays in °C)
      - lambda: return x * 9.0 / 5.0 + 32.0;
    on_value:
      then:
        - component.update: temp_range
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 10

  # Calibration Temp. at 0C
  - platform: template
    name: Calibration at 0°C - Temp. 1
    id: cal_0_sen
    icon: mdi:thermometer-low
    unit_of_measurement: "°C"
    disabled_by_default: true
    state_class: "measurement"
    device_class: "temperature"
    entity_category: "diagnostic"
    lambda: |-
      return {${cal_0}};
    web_server:
      sorting_group_id: sorting_group_temperature

  # Calibration Temp. at 100C
  - platform: template
    name: Calibration at 100°C - Temp. 1
    id: cal_100_sen
    icon: mdi:thermometer-high
    unit_of_measurement: "°C"
    disabled_by_default: true
    state_class: "measurement"
    device_class: "temperature"
    entity_category: "diagnostic"
    lambda: |-
      return {${cal_100}};
    web_server:
      sorting_group_id: sorting_group_temperature

  # Temperature Probe 2 - pinned to its ROM address
  - platform: dallas_temp
    address: ${addr_temp_2}
    id: temp_2
    icon: mdi:thermometer-water
    name: "Temperature 2"
    state_class: "measurement"
    device_class: "temperature"
    unit_of_measurement: "°F"
    update_interval: "${update_temp}"
    filters:
      - filter_out: NAN
      # Reject implausible raw readings (°C, pre-calibration) — see Temp 1.
      - lambda: |-
          if (x < 4.0 || x > 40.0) return {};
          return x;
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 0.0 -> ${cal_0_temp_2}
            - 100.0 -> ${cal_100_temp_2}
      # Convert to Fahrenheit (calibration above stays in °C)
      - lambda: return x * 9.0 / 5.0 + 32.0;
    on_value:
      then:
        - component.update: temp_range_2
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 60

  # Calibration Temp. 2 at 0C
  - platform: template
    name: Calibration at 0°C - Temp. 2
    id: cal_0_2_sen
    disabled_by_default: true
    icon: mdi:thermometer-low
    unit_of_measurement: "°C"
    state_class: "measurement"
    device_class: "temperature"
    entity_category: "diagnostic"
    lambda: |-
      return {${cal_0_temp_2}};
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 69

  # Calibration Temp. 2 at 100C
  - platform: template
    name: Calibration at 100°C - Temp. 2
    id: cal_100_2_sen
    disabled_by_default: true
    icon: mdi:thermometer-high
    unit_of_measurement: "°C"
    state_class: "measurement"
    device_class: "temperature"
    entity_category: "diagnostic"
    lambda: |-
      return {${cal_100_temp_2}};
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 69

binary_sensor:
  - platform: template
    name: Ideal Temperature
    id: ideal_temp
    icon: mdi:thermometer-check
    lambda: |-
      if (id(temp_range).state == "OK") {
        return true;
      } else {
        return false;
      }
    web_server:
      sorting_group_id: sorting_group_temperature

  - platform: template
    name: Ideal Temperature 2
    id: ideal_temp_2
    icon: mdi:thermometer-check
    lambda: |-
      if (id(temp_range_2).state == "OK") {
        return true;
      } else {
        return false;
      }
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 69

text_sensor:
  # Temperature Range 1
  - platform: template
    name: Temperature Range
    id: temp_range
    icon: mdi:thermometer-alert
    update_interval: "${update_temp}"
    lambda: |-
      if (isnan(id(temp_1).state)) {
        return {"Unknown"};
      } else if (id(temp_1).state <= id(range_cool).state) {
        return {"Cool"};
      } else if (id(temp_1).state >= id(range_warm).state) {
        return {"Warm"};
      } else {
        return {"OK"};
      }
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 12

  # Temperature Range 2
  - platform: template
    name: Temperature 2 Range
    id: temp_range_2
    icon: mdi:thermometer-alert
    update_interval: "${update_temp}"
    lambda: |-
      if (isnan(id(temp_2).state)) {
        return {"Unknown"};
      } else if (id(temp_2).state <= id(range_cool_2).state) {
        return {"Cool"};
      } else if (id(temp_2).state >= id(range_warm_2).state) {
        return {"Warm"};
      } else {
        return {"OK"};
      }
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 62

number:
  # Temperature 1 when Cool
  # NOTE: renamed °C -> °F. The new object_id resets the saved (restore_value)
  # threshold, so the °F initial_value takes effect on first boot after flash.
  - platform: template
    name: "Temp. Cool °F"
    id: range_cool
    icon: mdi:thermometer-low
    optimistic: true
    mode: box
    min_value: 32
    max_value: 104
    step: 0.5
    restore_value: true
    initial_value: ${range_cool}
    entity_category: "Config"
    device_class: "temperature"
    on_value:
      then:
        - component.update: temp_range
    web_server:
      sorting_group_id: sorting_group_temperature

  # Temperature 1 when Warm
  - platform: template
    name: "Temp. Warm °F"
    icon: mdi:thermometer-high
    id: range_warm
    optimistic: true
    mode: box
    min_value: 32
    max_value: 104
    step: 0.5
    restore_value: true
    initial_value: ${range_warm}
    entity_category: "Config"
    device_class: "temperature"
    on_value:
      then:
        - component.update: temp_range
    web_server:
      sorting_group_id: sorting_group_temperature

  # Temperature 2 when Cool
  - platform: template
    name: "Temp. 2 Cool °F"
    id: range_cool_2
    icon: mdi:thermometer-low
    optimistic: true
    mode: box
    min_value: 32
    max_value: 104
    step: 0.5
    restore_value: true
    initial_value: ${range_cool_2}
    entity_category: "Config"
    device_class: "temperature"
    on_value:
      then:
        - component.update: temp_range_2
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 69

  # Temperature 2 when Warm
  - platform: template
    name: "Temp. 2 Warm °F"
    icon: mdi:thermometer-high
    id: range_warm_2
    optimistic: true
    mode: box
    min_value: 32
    max_value: 104
    step: 0.5
    restore_value: true
    initial_value: ${range_warm_2}
    entity_category: "Config"
    device_class: "temperature"
    on_value:
      then:
        - component.update: temp_range_2
    web_server:
      sorting_group_id: sorting_group_temperature
      sorting_weight: 69
