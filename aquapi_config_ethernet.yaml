---
# =============================================================================
# AquaPi — Standard build, WIRED ETHERNET variant (WIZnet W5500 / WIZ850io)
# =============================================================================
# Same as aquapi_config.yaml, but uses a wired Ethernet connection instead of
# WiFi. It swaps in the WiFi-free device base and adds the ethernet package.
#
# Build/flash with the local repo:
#   esphome run aquapi_config_ethernet.yaml
#
# Wiring + power: see AquaPi-Ethernet-Wiring.md
# =============================================================================
# NOTE: the reef-specific substitutions that used to sit here now live in
# common/reef_overrides.yaml, shared with device-builder/aquapi.yaml so the two
# flash paths cannot drift. It is the LAST package below — order matters.

packages:
  device_base: !include common/device_base_ethernet.yaml   # WiFi-free base
  ethernet: !include common/ethernet.yaml                  # W5500 wired networking
  esp32: !include common/espboard.yaml
  # ota_https intentionally OMITTED for the customized Ethernet build.
  # The cloud HTTP-OTA flashes the STOCK Wi-Fi firmware and factory-resets the
  # device, which would wipe this Ethernet config and drop it off the network.
  # ESPHome OTA (from common/device_base_ethernet.yaml) handles all updates:
  #   git pull && esphome run aquapi_config_ethernet.yaml
  # ota_https: !include common/ota_https.yaml
  # Temperature: ROM addresses captured from the boot log 2026-07-30 and
  # pasted into _address.yaml, so the build is now address-based. Address-based
  # survives a probe dying/being swapped; index-based silently promotes the
  # survivor to index 0 and applies the dead probe's calibration to it.
  # Keep _index.yaml around only for re-reading addresses after a rebuild.
  # dallas: !include common/temperature_dallas_index.yaml
  dallas: !include common/temperature_dallas_address.yaml
  water_level: !include common/water_level.yaml
  binary: !include common/binary_ethernet.yaml   # no leak sensor (GPIO27 free)
  rodi_flow: !include common/rodi_flow.yaml       # RODI feed-line flow meter on GPIO27
  ezo_ph: !include common/ezo_ph.yaml
  ezo_ec: !include common/ezo_ec.yaml
  ezo_orp: !include common/ezo_orp.yaml
  water_quality: !include common/water_quality.yaml
  # ezo_co2 disabled: no CO2 probe installed (was: No Carbon Dioxide sensor at 105)
  # ezo_co2: !include common/ezo_co2.yaml
  ezo_do: !include common/ezo_do.yaml   # kept: DO probe to be installed later
  # EZO protocol lock buttons (pH/EC/ORP/DO only). NOT common/ezo_commands.yaml —
  # that file references co2/hum/o2/rtd + 5 pump IDs this build doesn't define.
  ezo_lock: !include common/ezo_lock.yaml
  # Per-circuit I2C presence sensors. NOT common/i2c_detection.yaml — that one
  # warns every 60s about the pump circuits that aren't installed here.
  i2c_detection: !include common/i2c_detection_reef.yaml
  # ezo_pmp / ezo_pmp_duo disabled: no dosing pumps installed (was: ezo-pmp:110 read error)
  # ezo_pmp: !include common/ezo_pmp.yaml
  # ezo_pmp_duo: !include common/ezo_pmp_duo.yaml
  aquapi: !include common/aquapi.yaml
  # ⚠ MUST STAY LAST — later packages win, which is what makes the reef
  # overrides beat the defaults in device_base_ethernet.yaml / water_quality.yaml.
  overrides: !include common/reef_overrides.yaml
